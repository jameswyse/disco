name: Publish image

on:
  workflow_call:
    inputs:
      tag:
        description: Existing stable release tag, for example v0.1.0.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to publish or resume, for example v0.1.0.
        required: true
        type: string

# One writer owns the moving tags, including manually resumed publications.
concurrency:
  group: publish-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Resolve release
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
      image: ${{ steps.release.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Resolve stable release to a commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease \
            --jq '.isDraft == false and .isPrerelease == false' | grep -qx true
          sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          {
            echo "sha=$sha"
            echo "version=${RELEASE_TAG#v}"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
          } >> "$GITHUB_OUTPUT"

  verify:
    name: Verify release commit
    needs: release
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.release.outputs.sha }}

  build:
    name: Build and check / ${{ matrix.arch }}
    needs: [release, verify]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: ${{ needs.release.outputs.image }}
      BUILD_TAG: build-${{ github.run_id }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build release image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ env.IMAGE }}:${{ env.BUILD_TAG }}
          build-args: |
            APPLICATION_VERSION=${{ needs.release.outputs.version }}
            APPLICATION_REVISION=${{ needs.release.outputs.sha }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
      - name: Check installation Compose file and container health
        env:
          DISCO_VERSION: ${{ env.BUILD_TAG }}
          SEERR_URL: https://seerr.validation.invalid
          SEERR_API_KEY: ci-not-a-real-key
        run: |
          docker compose up --detach --wait --wait-timeout 90 --pull never
          curl --fail --silent http://localhost:8785/api/health
      - name: Show container logs on failure
        if: failure()
        run: docker logs disco
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push checked image
        run: docker push "$IMAGE:$BUILD_TAG"

  publish:
    name: Publish version and update channels
    needs: [release, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: ${{ needs.release.outputs.image }}
      VERSION: ${{ needs.release.outputs.version }}
      REVISION: ${{ needs.release.outputs.sha }}
      BUILD_TAG: build-${{ github.run_id }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Preserve exact versions and advance eligible channels
        run: |
          # Candidate images have already created the package, even for the first release.
          gh api --paginate --slurp \
            "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${GITHUB_REPOSITORY#*/}/versions?per_page=100" \
            > package-versions.json
          jq '[.[][] | .metadata.container.tags[] | select(test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))] | unique' \
            package-versions.json > versions.json

          if jq --exit-status --arg version "$VERSION" 'index($version) != null' versions.json > /dev/null; then
            # A rerun resumes promotion from the original image, without rebuilding its tag.
            docker pull --platform linux/amd64 "$IMAGE:$VERSION"
            published_revision=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE:$VERSION")
            test "$published_revision" = "$REVISION"
          else
            docker buildx imagetools create --tag "$IMAGE:$VERSION" \
              "$IMAGE:$BUILD_TAG-amd64" "$IMAGE:$BUILD_TAG-arm64"
          fi

          # Compare numeric components. Backports may update their series, never a newer channel.
          jq --raw-output --arg version "$VERSION" '
            (. + [$version] | unique | map(split(".") | map(tonumber))) as $versions |
            ($version | split(".") | map(tonumber)) as $current |
            ($current[0:2] | map(tostring) | join(".")) as $minor |
            (if ($versions | map(select(.[0:2] == $current[0:2])) | max) == $current then $minor else empty end),
            (if $current[0] > 0 and ($versions | map(select(.[0] == $current[0])) | max) == $current then ($current[0] | tostring) else empty end),
            (if ($versions | max) == $current then "latest" else empty end)
          ' versions.json > channels.txt

          tags=()
          while IFS= read -r channel; do
            tags+=(--tag "$IMAGE:$channel")
          done < channels.txt
          if [ "${#tags[@]}" -gt 0 ]; then
            docker buildx imagetools create "${tags[@]}" "$IMAGE:$VERSION"
          fi
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          {
            echo "Published $IMAGE:$VERSION from $REVISION"
            echo 'Channels updated:'
            cat channels.txt
          } >> "$GITHUB_STEP_SUMMARY"
