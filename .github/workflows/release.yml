name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Version
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.release.outputs.release }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51
        id: changesets
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          version-script: pnpm changeset version
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
      - name: Find an unpublished version
        id: release
        if: steps.changesets.outputs.has-changesets == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version apps/web/package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags.txt"
          if ! grep -Fqx "v$version" "$RUNNER_TEMP/release-tags.txt"; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  image:
    name: Publish release image
    needs: version
    if: needs.version.outputs.release == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-image.yml
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    name: GitHub release
    needs: [version, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Create the release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            $0 == "## " version { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' apps/web/CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "Disco $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
