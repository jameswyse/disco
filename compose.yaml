services:
  disco:
    image: ghcr.io/jameswyse/disco:${DISCO_VERSION:-latest}
    container_name: disco
    restart: unless-stopped
    ports:
      - "${DISCO_PORT:-8785}:3000"
    environment:
      SEERR_URL: ${SEERR_URL:?Set SEERR_URL to your Seerr origin, for example https://request.example.com}
      SEERR_API_KEY: ${SEERR_API_KEY:?Set SEERR_API_KEY from Seerr → Settings → General}
    volumes:
      # Saved sidebar views.
      - disco-data:/data

volumes:
  disco-data:
