packages:
  - apps/*
  - packages/*

catalog:
  "@playwright/test": 1.65.0
  "@types/node": 24.19.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  effect: 4.1.2
  next: 16.4.5
  oxfmt: 0.77.0
  oxlint: 1.92.0
  react: 19.3.1
  react-dom: 19.3.1
  typescript: 7.0.2
  vitest: 5.1.0

minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200
strictDepBuilds: true
blockExoticSubdeps: true
savePrefix: ""
catalogPrune: true

update:
  githubActions: true
  ignoreDeps:
    # Node types follow the pinned Node major rather than DefinitelyTyped's latest major.
    - "@types/node"
