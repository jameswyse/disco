packages:
  - apps/*
  - packages/*

catalog:
  "@playwright/test": 1.64.0
  "@types/node": 24.19.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  effect: 4.0.2
  next: 16.4.0
  oxfmt: 0.72.0
  oxlint: 1.87.0
  react: 19.3.0
  react-dom: 19.3.0
  typescript: 7.0.2
  vitest: 5.0.3

minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
strictDepBuilds: true
blockExoticSubdeps: true
savePrefix: ""
cleanupUnusedCatalogs: true

update:
  ignoreDeps:
    # Node types follow the pinned Node major rather than DefinitelyTyped's latest major.
    - "@types/node"

allowBuilds:
  sharp: true
