packages:
  - apps/*
  - packages/*

catalog:
  "@oxlint/plugins": 1.83.0
  "@playwright/test": 1.63.0
  "@types/node": 26.6.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@effect/platform": 0.97.2
  effect: 3.22.2
  next: 16.3.5
  oxfmt: 0.68.0
  oxlint: 1.83.0
  react: 19.3.0
  react-dom: 19.3.0
  typescript: 7.0.2
  vitest: 5.0.1

minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
strictDepBuilds: true
blockExoticSubdeps: true
savePrefix: ""
cleanupUnusedCatalogs: true

update:
  ignoreDeps:
    # Node types follow the pinned Node major rather than DefinitelyTyped's latest major.
    - "@types/node"

allowBuilds:
  # Optional native accelerator pulled in by @effect/platform; the JS fallback is sufficient.
  msgpackr-extract: false
  sharp: true
