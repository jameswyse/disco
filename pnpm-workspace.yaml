packages:
  - apps/*
  - packages/*

catalog:
  "@oxlint/plugins": 1.86.0
  "@playwright/test": 1.63.0
  "@types/node": 26.6.4
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  effect: 4.0.0
  next: 16.3.8
  oxfmt: 0.71.0
  oxlint: 1.86.0
  react: 19.3.0
  react-dom: 19.3.0
  typescript: 7.0.2
  vitest: 5.0.3

minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
strictDepBuilds: true
blockExoticSubdeps: true
savePrefix: ""
cleanupUnusedCatalogs: true

update:
  ignoreDeps:
    # Node types follow the pinned Node major rather than DefinitelyTyped's latest major.
    - "@types/node"

allowBuilds:
  sharp: true
