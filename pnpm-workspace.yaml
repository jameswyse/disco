packages:
  - apps/*
  - packages/*

catalog:
  "@oxlint/plugins": 1.82.0
  "@playwright/test": 1.63.0
  "@types/node": 24.13.4
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  # TypeScript 7 CLI for repository type checks; API-based tooling still requires TypeScript 6.
  "@typescript/native": "npm:typescript@7.0.2"
  "@effect/platform": 0.97.2
  effect: 3.22.2
  next: 16.3.5
  oxfmt: 0.67.0
  oxlint: 1.82.0
  react: 19.3.0
  react-dom: 19.3.0
  # API-compatible compiler consumed by framework tooling until its TypeScript 7 support is stable.
  typescript: 6.0.3
  vitest: 5.0.0

minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
strictDepBuilds: true
blockExoticSubdeps: true
savePrefix: ""
cleanupUnusedCatalogs: true

update:
  ignoreDeps:
    # Node types follow the pinned Node major rather than DefinitelyTyped's latest major.
    - "@types/node"
    # TypeScript 6 remains the API-compatible package; TypeScript 7 is exposed through the CLI alias. Both should be kept up to date.
    - "typescript"

allowBuilds:
  esbuild: true
  msgpackr-extract: set this to true or false
  sharp: true
